# Google App Engine Configuration for Django Flight Booking App
runtime: python39
instance_class: F2

env_variables:
  DJANGO_SETTINGS_MODULE: "capstone.settings"
  GAE_APPLICATION: "1"

handlers:
  # Serve static files
  - url: /static
    static_dir: staticfiles/

  # Route all other requests to Django
  - url: /.*
    script: auto
    secure: always

automatic_scaling:
  min_instances: 0
  max_instances: 2
  target_cpu_utilization: 0.65

# Entry point
entrypoint: gunicorn -b :$PORT capstone.wsgi:application
