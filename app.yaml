# Google App Engine Configuration for Django Flight Booking App
runtime: python311
instance_class: F2

env_variables:
  DJANGO_SETTINGS_MODULE: "capstone.settings"
  GAE_APPLICATION: "1"

# Cloud SQL connection
beta_settings:
  cloud_sql_instances: flight-app-2025:asia-south1:flight-db

handlers:
  # Serve static files
  - url: /static
    static_dir: staticfiles/

  # Route all other requests to Django
  - url: /.*
    script: auto
    secure: always

automatic_scaling:
  min_instances: 1
  max_instances: 2
  target_cpu_utilization: 0.65

# Entry point - run migrations then start server
entrypoint: bash -c "python manage.py migrate --noinput && python manage.py shell -c \"from flight.utils import createWeekDays, addPlaces, addDomesticFlights; createWeekDays(); addPlaces(); addDomesticFlights()\" 2>/dev/null; gunicorn --bind :$PORT --workers 1 --threads 2 --timeout 120 capstone.wsgi:application"
