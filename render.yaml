# Render Blueprint - Auto-configures services when deploying
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: flight-booking-app
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn capstone.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.0"
      - key: RENDER
        value: "true"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: flight-db
          property: connectionString

databases:
  - name: flight-db
    plan: free
    databaseName: flightdb
    user: flightuser
